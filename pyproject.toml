[project]
name = "user-info-agent"
version = "0.1.0"
description = "An ADK agent that consumes an MCP server deployed on Cloud Run using end user authentication registered with Gemini Enterprise."
requires-python = ">=3.12"
dependencies = [
    "google-adk>=1.20.0",
    "python-dotenv>=1.0.0",
    "google-auth>=2.30.0",
    "google-cloud-spanner>=3.52.0",
    "rdflib",
    "langchain-google-spanner",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["agent_engine", "local"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"