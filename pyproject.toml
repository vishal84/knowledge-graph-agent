[project]
name = "knowledge-graph-agent"
version = "0.1.0"
description = "An ADK agent that uses a knowledge graph deployed on Spanner with end user authentication registered with Gemini Enterprise."
requires-python = ">=3.12"
dependencies = [
    "google-adk>=1.20.0",
    "python-dotenv>=1.0.0",
    "google-auth>=2.30.0",
    "google-cloud-spanner>=3.52.0",
    "rdflib",
    "langchain-google-spanner",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["agent_engine", "local"]

[tool.hatch.build.targets.wheel.force-include]
"agent_engine/ontology_file.ttl" = "agent_engine/ontology_file.ttl"
"ontology_file.ttl" = "ontology_file.ttl"

[tool.hatch.build.targets.sdist]
include = [
    "/agent_engine/ontology_file.ttl",
    "/ontology_file.ttl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"